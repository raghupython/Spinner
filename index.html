<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Side A vs Side B Spinner</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 50px;
}

#wheel {
    width: 250px;
    height: 250px;
    border-radius: 50%;
    border: 5px solid #333;
    background: conic-gradient(
        #4CAF50 0deg 180deg,
        #FF5722 180deg 360deg
    );
    margin: 20px auto;
    transition: transform 4s ease-out;
}

.pointer {
    font-size: 40px;
    margin-bottom: -10px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    font-size: 24px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="pointer">▼</div>
<div id="wheel"></div>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<script>
let currentRotation = 0;

function spin() {
    const wheel = document.getElementById("wheel");
    const result = document.getElementById("result");

    const random = Math.random();
    const winner = random < 0.5 ? "Side A" : "Side B";

    let targetAngle;

    if (winner === "Side A") {
        targetAngle = 90;
    } else {
        targetAngle = 270;
    }

    currentRotation += 1800 + targetAngle;

    wheel.style.transform = `rotate(${currentRotation}deg)`;

    result.innerHTML = "";

    setTimeout(() => {
        result.innerHTML = "🎉 Result: " + winner;
    }, 4000);
}
</script>

</body>
</html>
