<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20 Option Spinner</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
    margin:20px;
}

h1{
    margin-bottom:10px;
}

#wheel-container{
    position:relative;
    width:90vw;
    max-width:500px;
    margin:auto;
}

#pointer{
    position:absolute;
    top:-5px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:40px solid red;
    z-index:10;
}

#wheel{
    width:100%;
    transition:transform 5s cubic-bezier(.17,.67,.12,.99);
}

button{
    margin-top:20px;
    padding:12px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    background:#1976D2;
    color:white;
    cursor:pointer;
}

#result{
    margin-top:25px;
    font-size:32px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>🎡 20 Option Spinner new</h1>

<div id="wheel-container">
    <div id="pointer"></div>
    <canvas id="wheel" width="500" height="500"></canvas>
</div>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<script>

const options = Array.from({length:20}, (_,i)=>(i+1).toString());

const colors = [
"#F44336","#4CAF50","#2196F3","#FFC107",
"#9C27B0","#00BCD4","#E91E63","#8BC34A",
"#FF9800","#3F51B5","#795548","#009688",
"#673AB7","#CDDC39","#FF5722","#03A9F4",
"#FFEB3B","#607D8B","#9C27B0","#4CAF50"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const center = 250;
const radius = 250;
const sliceAngle = 360 / options.length;

let currentRotation = 0;
let spinning = false;

function drawWheel(){

    const arc = 2 * Math.PI / options.length;

    for(let i=0;i<options.length;i++){

        ctx.beginPath();
        ctx.moveTo(center,center);

        ctx.fillStyle = colors[i];

        ctx.arc(
            center,
            center,
            radius,
            i * arc - Math.PI/2,
            (i+1) * arc - Math.PI/2
        );

        ctx.closePath();
        ctx.fill();

        ctx.save();

        ctx.translate(center,center);
        ctx.rotate(i * arc + arc/2 - Math.PI/2);

        ctx.fillStyle="white";
        ctx.font="bold 18px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            options[i],
            radius - 70,
            6
        );

        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(center,center,35,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
    ctx.strokeStyle="#444";
    ctx.stroke();
}

drawWheel();

function spin(){

    if(spinning) return;

    spinning = true;

    const winnerIndex =
        Math.floor(Math.random() * options.length);

    const targetRotation =
        360 -
        (winnerIndex * sliceAngle) -
        (sliceAngle / 2);

    currentRotation =
        currentRotation +
        1800 +
        targetRotation -
        (currentRotation % 360);

    canvas.style.transform =
        `rotate(${currentRotation}deg)`;

    document.getElementById("result").innerHTML = "";

    setTimeout(() => {

        document.getElementById("result").innerHTML =
            "🎉 Result: " + options[winnerIndex];

        spinning = false;

    },5000);
}

</script>

</body>
</html>
